[package]
name = "mlnpdf"
version = "0.1.0"
edition = "2024"
# GPL-3.0-or-later: las versiones distribuidas tienen que seguir siendo libres.
license = "GPL-3.0-or-later"

[dependencies]
# Published as `gtk4`; renamed to `gtk` (gtk-rs convention).
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_10", "v4_12", "v4_14"] }
# High-level poppler-glib bindings. Must share one cairo-rs version with gtk4,
# otherwise `cairo::Context` would be two different types.
poppler = { package = "poppler-rs", version = "0.26.0" }
cairo-rs = { version = "0.22.9", features = ["pdf"] }
# GLib bindings, used by poppler-rs; the engine must not depend on GTK.
glib = "0.22"
# Writing is the one thing poppler-glib cannot do, so the annotations are added
# with a pure-Rust PDF writer. No default features: neither rayon nor chrono is
# needed to append an object and save, and both drag extra dependencies in.
lopdf = { version = "0.46", default-features = false }
# Texto de las notas: el layout de Pango mide el ancho y pangocairo lo pinta
# sobre la capa de la página. Mismo tren 0.22 que usa gtk4.
pango = "0.22"
pangocairo = "0.22"
